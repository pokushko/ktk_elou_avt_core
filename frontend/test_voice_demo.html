<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест голосовых оповещений КОМПАКС & ПАЗ — КТК ЭЛОУ-АВТ-5/5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 8px;
        }
        h2 {
            color: #94a3b8;
            font-size: 14px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        button.danger {
            background: #dc2626;
        }
        button.danger:hover {
            background: #b91c1c;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }
        button.warning {
            background: #d97706;
        }
        button.warning:hover {
            background: #b45309;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            font-family: monospace;
            color: #38bdf8;
            font-size: 14px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔊 Демонстратор Системы Голосовых Оповещений</h1>
    <h2>Мониторинг «КОМПАКС» и Блокировки ПАЗ — ЭЛОУ-АВТ-5/5</h2>

    <div class="btn-group">
        <button class="danger" onclick="playVoice('Внимание! Опасная вибрация подшипника насоса сырья Аш один А! 8.4 миллиметра в секунду! Перейдите на резерв!')">
            🚨 Авария «КОМПАКС»: Насос Н-1А (Вибрация > 7.1 мм/с)
        </button>

        <button class="warning" onclick="playVoice('Предупреждение. Повышенная вибрация подшипника печного насоса Аш два А. 5.2 миллиметра в секунду.')">
            ⚠️ Предупреждение «КОМПАКС»: Насос Н-2А (Вибрация 5.2 мм/с)
        </button>

        <button class="danger" onclick="playVoice('Внимание! Сработала противоаварийная защита ПАЗ! Высокая температура на выходе из печи Пе один! Подача топлива заблокирована!')">
            🛑 Блокировка ПАЗ: Перегрев Печи П-1
        </button>

        <button onclick="playVoice('Экспресс лаборатория ЛИМС. Анализ керосиновой фракции завершен. Температура вспышки в норме, 42 градуса.')">
            🧪 Сообщение LIMS: Анализ качества фракций
        </button>
    </div>

    <div class="status-box" id="status">
        Нажмите любую кнопку выше для проверки голоса
    </div>
</div>

<script>
    function playVoice(text) {
        document.getElementById('status').innerText = '🗣️ Воспроизведение: "' + text + '"';
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // сброс прошлых фраз
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        } else {
            document.getElementById('status').innerText = '❌ Ваш браузер не поддерживает Web Speech API';
        }
    }
</script>

</body>
</html>
