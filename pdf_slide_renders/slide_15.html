<!DOCTYPE html>

        @page { size: 16in 9in; margin: 0; }
        body {
            background-color: #050819;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .page {
            width: 16in;
            height: 9in;
            page-break-after: always;
            box-sizing: border-box;
            padding: 0.5in 0.7in;
            background: #0a121e;
            border: 2px solid #00f2fe;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00f2fe;
            padding-bottom: 0.1in;
        }
        .title {
            font-size: 24pt;
            font-weight: 800;

            background: rgba(0, 242, 254, 0.2);

            color: #00f2fe;
            padding: 4pt 12pt;
            border-radius: 20pt;
            font-weight: bold;
            font-size: 12pt;
        }
        .body-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 0.3in;
            margin-top: 0.2in;
            flex-grow: 1;
            align-items: center;
        }
        .body-full {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin-top: 0.2in;
        }
        .content {
            font-size: 14pt;
            line-height: 1.6;
            color: #e0e6ed;
        }
        .content ul { margin: 0; padding-left: 20pt; }
        .content li { margin-bottom: 10pt; }
        .footer {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 0.1in;
            font-size: 11pt;
            color: #78909c;
        }
        .slide-img {
            width: 100%;
            max-height: 5.5in;
            object-fit: contain;
            border: 1px solid #00f2fe;
            border-radius: 8pt;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }
        .slide-img-full {
            width: 90%;
            max-height: 6in;
            object-fit: contain;
            border: 1px solid #00f2fe;
            border-radius: 8pt;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }
        .team-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #00f2fe;
            border-radius: 10pt;
            padding: 14pt;
            margin-bottom: 12pt;
        }
        table.spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11pt;
            margin-top: 5pt;
        }
        table.spec-table th, table.spec-table td {
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6pt 10pt;
            text-align: left;
        }
